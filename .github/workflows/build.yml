name: Build Nike APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract project
        run: unzip -q NikeAndroidStarter_v2.zip -d source
      - name: Build APK
        run: |
          PROJECT=$(find source -name settings.gradle.kts -print -quit | xargs dirname)
          cd "$PROJECT"
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nike-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
